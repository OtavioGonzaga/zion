name: Deploy

on:
  workflow_dispatch:
    inputs:
      source:
        description: Deploy a published release or an unversioned snapshot
        required: true
        type: choice
        options: [release, snapshot]
      release_version:
        description: Release version without v (required when source is release)
        required: false
        type: string
      snapshot:
        description: Snapshot target (used when source is snapshot)
        required: true
        default: latest
        type: choice
        options: [latest, commit]
      commit_sha:
        description: Full 40-character commit SHA (required when snapshot is commit)
        required: false
        type: string

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.target.outputs.ref }}
      label: ${{ steps.target.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: target
        env:
          SOURCE: ${{ inputs.source }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          SNAPSHOT: ${{ inputs.snapshot }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          case "$SOURCE" in
            release)
              test -n "$RELEASE_VERSION"
              [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
              tag="v$RELEASE_VERSION"
              gh release view "$tag" >/dev/null
              ref="$(git rev-parse "$tag^{}")"
              label="$tag"
              ;;
            snapshot)
              case "$SNAPSHOT" in
                latest)
                  ref="$(git rev-parse origin/main)"
                  label="snapshot-$(git rev-parse --short "$ref")"
                  ;;
                commit)
                  [[ "$COMMIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
                  git fetch origin "$COMMIT_SHA"
                  ref="$(git rev-parse FETCH_HEAD)"
                  label="snapshot-$(git rev-parse --short "$ref")"
                  ;;
                *) exit 1 ;;
              esac
              ;;
            *) exit 1 ;;
          esac
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"

  deploy:
    needs: resolve
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v4.0.0
