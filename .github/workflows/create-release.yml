name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer version without a v prefix
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Prepare release commit locally
        id: candidate
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
          tag="v$VERSION"
          current_version="$(bun -e 'const p = await Bun.file("package.json").json(); console.log(p.version)')"
          if [[ "$current_version" = "$VERSION" ]]; then
            test "$(git log -1 --format=%s)" = "chore(release): v$VERSION"
            grep -Eq "^## \[$VERSION\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md
            test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
            echo "already_pushed=true" >> "$GITHUB_OUTPUT"
          else
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "Tag $tag exists without a matching release commit on main." >&2
              exit 1
            fi
            bun run release:prepare -- "$VERSION"
            git diff --check
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add package.json CHANGELOG.md
            git commit -m "chore(release): v$VERSION"
            test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)"
            echo "already_pushed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "release_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Validate release candidate
        run: |
          set -euo pipefail
          bun run format:check
          bun run lint
          bun run typecheck
          bun run test
          bun run build
          bunx playwright install --with-deps chromium
          bun run test:e2e
      - name: Publish validated commit, tag, and release
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ steps.candidate.outputs.release_commit }}
          ALREADY_PUSHED: ${{ steps.candidate.outputs.already_pushed }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          git fetch origin main --tags
          if [[ "$ALREADY_PUSHED" = "true" ]]; then
            test "$(git rev-parse origin/main)" = "$RELEASE_COMMIT"
          else
            test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD^)"
            git push origin HEAD:main
          fi

          tag="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            remote_tag_commit="$(git ls-remote origin "refs/tags/$tag^{}" | cut -f1)"
            if [[ -z "$remote_tag_commit" ]]; then
              remote_tag_commit="$(git ls-remote origin "refs/tags/$tag" | cut -f1)"
            fi
            test "$remote_tag_commit" = "$RELEASE_COMMIT"
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag --annotate "$tag" "$RELEASE_COMMIT" --message "Release $tag"
            git push origin "refs/tags/$tag"
          fi

          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --generate-notes
          fi
